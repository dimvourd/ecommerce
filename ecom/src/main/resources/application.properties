spring.application.name=ecom

server.port=8083

spring.datasource.url=jdbc:postgresql://localhost:5432/ecommercedb
spring.datasource.username=ecommerce_user
spring.datasource.password=ecommerce_password

spring.jpa.database=POSTGRESQL
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# actuator
#management.endpoints.web.exposure.include=*
# expoxing specific endpoint
management.endpoints.web.exposure.include=beans
    # health
management.endpoint.health.show-details=always
    # info
management.info.env.enabled=true

info.app.name=eCommerce App
info.app.description=eCommerce App
info.app.version=1.0.0

    # metrics
# no need to configure metrics

    # shutdown
management.endpoint.shutdown.enabled=true
#  graceful shutdown to finish all the requests
# server.shutdown=graceful


