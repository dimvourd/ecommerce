# mongo DB
spring.data.mongodb.uri=mongodb://root:rootpass@localhost:27017/userdb?authSource=admin
spring.data.mongodb.database=userdb
spring.data.mongodb.auto-index-creation=true


# actuator
#management.endpoints.web.exposure.include=*
# expoxing specific endpoint
management.endpoints.web.exposure.include=beans
# health
management.endpoint.health.show-details=always
# info
management.info.env.enabled=true

info.app.name=User App
info.app.description=User App
info.app.version=1.0.0

# metrics
# no need to configure metrics

# shutdown
management.endpoint.shutdown.enabled=true
