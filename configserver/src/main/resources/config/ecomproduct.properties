spring.application.name=ecomproduct

server.port=8085



# product is the schema
spring.datasource.url=jdbc:postgresql://localhost:5432/product
spring.datasource.username=ecommerce_user
spring.datasource.password=ecommerce_password


spring.jpa.database=POSTGRESQL
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

#spring.datasource.url=jdbc:mysql://localhost:3307/product
#spring.datasource.username=product_user
#spring.datasource.password=product_password
