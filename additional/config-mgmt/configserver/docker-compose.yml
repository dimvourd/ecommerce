services:
  mysql:
    image: mysql:8.4
    container_name: config-db
    environment:
      MYSQL_ROOT_PASSWORD: configDB
      MYSQL_DATABASE: configDB
      MYSQL_USER: configuser
      MYSQL_PASSWORD: configpassword
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql

volumes:
  mysql-data: