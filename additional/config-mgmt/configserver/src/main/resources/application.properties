## creation of the key
## \.jdks\openjdk-21\bin>
## .\keytool -> the program of jdk
## -genkeypair -> generate a key pair
## -alias config-server-key -> just the alias
## -keyalg RSA -> specifying the encryption algorithm(alg)
## -dname "CN=Config Server, OU=Spring Cloud, O=Company" -> distinguish name
## -keypass mypass -> password of the key
## -keystore config-server.jks -> the file to store the key ( before it We can change the path)
## -storepass configserverpass -> password for the key store
#
## .\keytool.exe -genkeypair -alias config-server-key -keyalg RSA -dname "CN=Config Server, OU=Spring Cloud, O=Company" -keystore "C:\Users\me\Desktop\Courses\eCommerce Project\additional\config-mgmt\configserver\src\main\resources\config-server.jks" -storepass configserverpass
