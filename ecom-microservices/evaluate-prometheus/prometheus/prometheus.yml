global:
  scrape_interval: 5s

scrape_configs:

  - job_name: 'ecomproduct'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets:
          - 'host.docker.internal:8085'
        labels:
          application: 'ecomproduct'

  - job_name: 'ecomuser'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets:
          - 'host.docker.internal:8082'
        labels:
          application: 'ecomuser'

  - job_name: 'ecomorder'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets:
          - 'host.docker.internal:8084'
        labels:
          application: 'ecomorder'