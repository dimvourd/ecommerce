# mongo DB
spring.data.mongodb.uri=${DATA_MONGODB_URI}
spring.data.mongodb.database=${DATA_MONGODB_NAME}
spring.data.mongodb.auto-index-creation=true


# actuator
management.endpoints.web.exposure.include=*
# expoxing specific endpoint
#management.endpoints.web.exposure.include=beans
# health
management.endpoint.health.show-details=always
# info
management.info.env.enabled=true

info.app.name=User App
info.app.description=User App
info.app.version=1.0.0

# metrics
# no need to configure metrics

# shutdown
management.endpoint.shutdown.enabled=true
#  graceful shutdown to finish all the requests
# server.shutdown=graceful

# Eureka server
eureka.client.fetch-registry=true
eureka.client.register-with-eureka=true
eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka/

# Logging
logging.file.name=logs/user-service.log
logging.logback.rollingpolicy.max-file-size=10KB
logging.logback.rollingpolicy.max-history=7
logging.logback.rollingpolicy.total-size-cap=1MB
logging.logback.rollingpolicy.file-name-pattern=logs/user-service/user-service-%d{yyyy-MM-dd}.%i.log.gz




