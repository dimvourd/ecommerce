spring.application.name=ecomorder

server.port=8084

spring.datasource.url=${DATASOURCE_URL}
spring.datasource.username=${DATASOURCE_USERNAME}
spring.datasource.password=${DATASOURCE_PASSWORD}

spring.jpa.database=POSTGRESQL
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# actuator
#management.endpoints.web.exposure.include=*
# expoxing specific endpoint
# management.endpoints.web.exposure.include=beans
# health
management.endpoint.health.show-details=always
# info
management.info.env.enabled=true
# actuator for rabbitmq busrefresh
management.endpoints.web.exposure.include=*

info.app.name=Order App
info.app.description=Order App
info.app.version=1.0.0

# metrics
# no need to configure metrics

# shutdown
management.endpoint.shutdown.enabled=true
#  graceful shutdown to finish all the requests
# server.shutdown=graceful


